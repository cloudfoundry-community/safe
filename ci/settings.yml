---
# base.yml is marked DO NOT MODIFY, so the OpenBao job is appended to the
# release group from here rather than listed alongside the test-vault-* jobs
# there.
groups:
- name: (( concat "build-" meta.pipeline "-releases" ))
  jobs:
  - (( append ))
  - test-openbao-2.6

meta:
  name:    safe
  release: Safe
  target:  pipes/cloudfoundry-community
  url:     https://pipes.scalecf.com

  initial_version: 0.0.5

  go:
    force_static_binary: true

  git:
    email: ci@cloudfoundry-community.com
    name:  Cloudfoundry Community CI Bot

  aws:
    access_key: ((aws.access_key_id))
    secret_key: ((aws.secret_access_key))

  github:
    owner:           cloudfoundry-community
    repo:            safe
    branch:          develop
    main-branch:     main
    private_key:     ((github.private_key))
    access_token:    ((github.access_token))
    access_token_rw: ((github.access_token_rw))

  slack:
    webhook: ((slack.webhook))
    channel: '#vault'
